[project]
name = "equinox-forge"
version = "0.37.0"
description = "Model-independent canonical knowledge compiler for Equinox"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "safetensors>=0.4",
]

[project.scripts]
eqforge = "equinox_forge.cli:main"
eqforge-gauntlet = "equinox_forge.baseline_gauntlet:main"
eqforge-support-gate = "equinox_forge.support_gate_benchmark:main"
eqforge-novel-entity = "equinox_forge.novel_entity_admission:main"
eqforge-relation-compose = "equinox_forge.relation_composition:main"
eqforge-relation-induce = "equinox_forge.relation_composition_induction:main"
eqforge-composition-lifecycle = "equinox_forge.composition_lifecycle:main"
eqforge-source-lineage = "equinox_forge.source_lineage_benchmark:main"

[project.optional-dependencies]
hf-runtime = [
  "torch>=2.1",
  "transformers>=4.48,<5",
  "tokenizers>=0.21",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["equinox_forge*"]
exclude = ["adapters*", "examples*", "out*", "tests*", "benchmarks*", "tools*"]
