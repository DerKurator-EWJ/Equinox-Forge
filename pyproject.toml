[project]
name = "equinox-forge"
version = "0.20.0"
description = "Model-independent canonical knowledge compiler for Equinox"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "safetensors>=0.4",
]

[project.scripts]
eqforge = "equinox_forge.cli:main"

[project.optional-dependencies]
hf-runtime = [
  "torch>=2.1",
  "transformers>=4.48,<5",
  "tokenizers>=0.21",
]
