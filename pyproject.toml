[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equinox-forge"
version = "0.30.0"
description = "Model-independent canonical knowledge compiler for Equinox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "safetensors>=0.4",
]

[project.scripts]
eqforge = "equinox_forge.cli:main"
equinox-forge = "equinox_forge.cli:main"

[project.optional-dependencies]
hf-runtime = [
  "torch>=2.1",
  "transformers>=4.48,<5",
  "tokenizers>=0.21",
]
dev = [
  "build>=1.2",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["equinox_forge*"]
exclude = ["adapters*", "examples*", "out*", "tests*", "tools*"]

[tool.setuptools.package-data]
equinox_forge = ["adapters/*.json"]

[tool.ruff]
target-version = "py310"
exclude = ["examples", "out"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
